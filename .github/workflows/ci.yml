name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
        working-directory: backend
      - name: Install Ruff
        run: python -m pip install "ruff==0.17.6"
        working-directory: backend
      - name: Run Ruff
        run: ruff check kore_next
        working-directory: backend
      - name: Run isolated regression tests
        run: python -m unittest discover -s tests -v
        working-directory: backend
      - name: Compile Python sources
        run: python -m compileall -q kore_next
        working-directory: backend

  desktop:
    name: Desktop
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: desktop
      - name: Type check
        run: npm run typecheck
        working-directory: desktop
      - name: Build desktop bundle
        run: npm run build
        working-directory: desktop
      - name: Install test browser
        run: npx playwright-core install --with-deps chromium
        working-directory: desktop
      - name: Check run recovery interactions
        working-directory: desktop
        shell: bash
        run: |
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 15186 --strictPort > "$RUNNER_TEMP/recovery-vite.log" 2>&1 &
          TEST_VITE_PID=$!
          trap 'kill "$TEST_VITE_PID" 2>/dev/null || true' EXIT
          npx wait-on --timeout 30000 http-get://127.0.0.1:15186
          npm run test:recovery
